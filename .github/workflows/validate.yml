name: Validate platform

on:
  pull_request:
  push:
    branches: ['feat/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/school-visuals.mjs tests/teacher-materials.mjs tests/guided-lab-11.mjs tests/guided-lab-10.mjs tests/guided-lab-9.mjs tests/guided-lab-8.mjs tests/school-materials.mjs tests/university-control.mjs tests/lecture-order.mjs tests/platform.mjs tests/redox.mjs tests/bond-practice.mjs tests/registration.mjs tests/bridge-path.mjs tests/bond-models.mjs tests/bond-lab.mjs tests/equivalent-path.mjs tests/school.mjs tests/guided-lab.mjs
      - run: node scripts/generate-school-specs.mjs --check
      - run: python3 tests/integration.py
      - run: python3 tests/security.py
      - run: python3 tests/school_integration.py
      - run: python3 tests/guided_lab_validation.py
      - run: python3 tests/guided_lab_integration.py
      - run: node build.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1 @electric-sql/pglite@0.5.10
      - run: node tests/guided-lab.sql.mjs
      - run: node tests/guided-lab-11.sql.mjs
      - run: node tests/guided-lab-10.sql.mjs
      - run: node tests/guided-lab-9.sql.mjs
      - run: node tests/guided-lab-8.sql.mjs
      - run: node tests/university-control.sql.mjs
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/school.browser.mjs
      - run: node --test tests/teacher-materials.browser.mjs tests/guided-lab-11.browser.mjs tests/guided-lab-10.browser.mjs tests/guided-lab-9.browser.mjs tests/guided-lab-8.browser.mjs tests/university-labs.browser.mjs tests/university-control.browser.mjs tests/bond-practice.browser.mjs tests/registration.browser.mjs tests/bridge-path.browser.mjs tests/equivalent-path.browser.mjs tests/guided-lab.browser.mjs
