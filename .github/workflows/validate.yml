name: Validate platform

on:
  pull_request:
  push:
    branches: ['feat/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/platform.mjs tests/redox.mjs tests/bond-practice.mjs tests/registration.mjs tests/bridge-path.mjs tests/bond-models.mjs tests/bond-lab.mjs tests/equivalent-path.mjs
      - run: python3 tests/integration.py
      - run: python3 tests/security.py
      - run: node build.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/bond-practice.browser.mjs tests/registration.browser.mjs tests/bridge-path.browser.mjs tests/equivalent-path.browser.mjs
