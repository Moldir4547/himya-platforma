<h1>Химиялық ойындар</h1><p>Тақырыпты таңдаңыз. Сабақты кроссвордпен бастаңыз, ұғымдарды жұптастырыңыз немесе қысқа есеппен бекітіңіз.</p></div><svg class="hero-art" viewBox="0 0 400 245" aria-hidden="true" focusable="false">

<div class="picker screen" aria-label="Ойын таңдау"><label>Білім деңгейі<select id="level"><option value="school">Мектеп</option><option value="university">Университет</option></select></label><label id="grade-label">Сынып<select id="grade"></select></label><label>Тақырып<select id="topic"></select></label></div>
<nav class="choices screen" aria-label="Ойын түрлері"><button type="button" data-mode="cross">Кроссворд</button><button type="button" data-mode="match">Терминдер жұбы</button><button type="button" data-mode="code">Химиялық код</button></nav>
<div class="challenge screen" aria-label="Айналым баптауы"><label>Қиындық<select id="difficulty"><option value="practice">Жаттығу</option><option value="hard">Күрделі</option></select></label><label>Уақыт<select id="seconds"><option value="0">Шектеусіз</option><option value="60">1 минут</option><option value="120">2 минут</option><option value="180">3 минут</option><option value="300">5 минут</option></select></label><div class="timer-box"><div class="timer-top"><span id="clock" role="timer" aria-label="Қалған уақыт" hidden></span><button class="primary" id="start-round" type="button" hidden>Бастау</button></div><progress id="time-meter" aria-label="Қалған уақыт жолағы" hidden></progress><p id="round-status" role="status"></p></div></div>
<section id="game" aria-labelledby="game-title"></section>
<footer class="screen"><p>Тақтада бүкіл сыныппен немесе телефонда жеке ойнауға болады. Ұпай журналға жазылмайды.</p><button id="print" type="button">Басып шығару</button></footer>
<noscript>Ойындарды ашу үшін браузерде JavaScript қосулы болуы керек.</noscript>
